services:
  atlas:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ATLAS_PUBLIC_ORIGINS: ${ATLAS_PUBLIC_ORIGINS:?Set the exact public origin}
    volumes:
      - ${ATLAS_SITE_DIR:?Set the absolute release directory}:/site:ro
    ports:
      - "127.0.0.1:${ATLAS_PORT:-8765}:8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
