# Static SemRel atlas: nginx serves the unpacked site.tar directly; no application server is needed.
# Replace server_name and root, then: nginx -t && systemctl reload nginx. Add HTTPS with certbot or your own certificate.
server {
    listen 80;
    server_name atlas.example.com;
    root /srv/semrel/site;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain text/csv text/markdown image/svg+xml;

    # Hidden files are never part of the site.
    location ~ /\. { deny all; }

    # Per-query detail files are content-addressed, so they can be cached for a long time.
    location /assets/details/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /assets/ { expires 1h; }

    # "Environment & inputs" links open these folders as file listings.
    location ~ ^/(data|environment|catalog|upstream|exports)/ {
        autoindex on;
        autoindex_exact_size off;
    }

    location = /api/health { default_type application/json; return 200 '{"status":"ready","eal_import":false}'; }
}
